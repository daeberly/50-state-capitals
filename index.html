function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function normalize(s) {
  return s.trim().toLowerCase().replace(/^(st\.?|saint)\s/, "saint ").replace(/[^a-z ]/g, "");
}
function makeDeck() {
  return { order: shuffle(STATES), pos: 0, correct: 0, total: 0, finished: false };
}
function makeMatch() {
  const shuffled = shuffle(STATES);
  const batches = [];
  for (let i = 0; i < 50; i += 10) batches.push(shuffled.slice(i, i + 10));
  return {
    batches, batchIndex: 0,
    matchedIds: new Set(), wrongPairs: new Set(), correctFirstTry: 0,
    selectedState: null, selectedCapital: null, flashWrongIds: null,
    leftOrder: shuffle(batches[0].map((s) => s.id)),
    rightOrder: shuffle(batches[0].map((s) => s.id)),
    finished: false,
  };
}

const LEVELS = [
  { key: "flash", label: "Flash Cards" },
  { key: "choice", label: "Multiple Choice" },
  { key: "matching", label: "Matching" },
  { key: "map", label: "Map Fill-In" },
  { key: "blank", label: "Fill in the Blank" },
];
const GRADE_OPTIONS = [
  { value: 1.0, pct: 100, grade: "A+" },
  { value: 0.9, pct: 90, grade: "A" },
  { value: 0.8, pct: 80, grade: "B" },
  { value: 0.7, pct: 70, grade: "C" },
];

const COLORS = {
  ink: "#1e2a22", paper: "#EDE4D3", paperAlt: "#DDD1B6",
  rust: "#A0472D", pine: "#3A5A45", brass: "#B8935A",
  sage: "#8FA68F", panel: "#25342A", panelBorder: "#3A4A3D",
};

const STORAGE_KEY = "fieldAtlasProgress_v1";

function loadProgress() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    return null;
  }
}
function saveProgress(data) {
  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    /* storage unavailable or full — fail silently */
  }
}
function clearProgress() {
  try {
    window.localStorage.removeItem(STORAGE_KEY);
  } catch (e) {}
}
function makeDeckFromSaved(saved) {
  if (!saved) return makeDeck();
  return {
    order: saved.order.map((id) => STATES[id]),
    pos: saved.pos, correct: saved.correct, total: saved.total, finished: saved.finished,
  };
}
function makeMatchFromSaved(saved) {
  if (!saved) return makeMatch();
  return {
    batches: saved.batches.map((batch) => batch.map((id) => STATES[id])),
    batchIndex: saved.batchIndex,
    matchedIds: new Set(saved.matchedIds),
    wrongPairs: new Set(saved.wrongPairs),
    correctFirstTry: saved.correctFirstTry,
    selectedState: null, selectedCapital: null, flashWrongIds: null,
    leftOrder: saved.leftOrder, rightOrder: saved.rightOrder,
    finished: false,
  };
}

function App() {
  const saved = loadProgress();

  const [levelIdx, setLevelIdx] = useState(() => (saved ? saved.levelIdx : 0));
  const [unlockedUpTo, setUnlockedUpTo] = useState(() => (saved ? saved.unlockedUpTo : 0));
  const [completed, setCompleted] = useState(() => new Set(saved ? saved.completed : []));
  const [stamped, setStamped] = useState(() => new Set(saved ? saved.stamped : []));
  const [passThreshold, setPassThreshold] = useState(() => (saved ? saved.passThreshold : 0.7));

  const [deck, setDeck] = useState(() => (saved && saved.deck ? makeDeckFromSaved(saved.deck) : makeDeck()));
  const [flipped, setFlipped] = useState(false);
  const [choiceOptions, setChoiceOptions] = useState([]);
  const [pickedChoice, setPickedChoice] = useState(null);
  const [typed, setTyped] = useState("");
  const [feedback, setFeedback] = useState(null);
  const [stampBurst, setStampBurst] = useState(false);
  const [answered, setAnswered] = useState(false);
  const [match, setMatch] = useState(() => (saved && saved.match ? makeMatchFromSaved(saved.match) : makeMatch()));
  const inputRef = useRef(null);
  const didMount = useRef(false);

  const levelKey = LEVELS[levelIdx].key;
  const current = deck.order[deck.pos];

  useEffect(() => {
    if (!didMount.current) { didMount.current = true; return; }
    if (levelKey === "matching") { setMatch(makeMatch()); return; }
    setDeck(makeDeck());
  }, [levelIdx]);

  useEffect(() => {
    saveProgress({
      levelIdx, unlockedUpTo,
      completed: Array.from(completed),
      stamped: Array.from(stamped),
      passThreshold,
      deck: { order: deck.order.map((s) => s.id), pos: deck.pos, correct: deck.correct, total: deck.total, finished: deck.finished },
      match: {
        batches: match.batches.map((b) => b.map((s) => s.id)),
        batchIndex: match.batchIndex,
        matchedIds: Array.from(match.matchedIds),
        wrongPairs: Array.from(match.wrongPairs),
        correctFirstTry: match.correctFirstTry,
        leftOrder: match.leftOrder, rightOrder: match.rightOrder,
      },
    });
  }, [levelIdx, unlockedUpTo, completed, stamped, passThreshold, deck, match]);

  function resetProgress() {
    if (window.confirm("Clear all saved progress? This can't be undone.")) {
      clearProgress();
      window.location.reload();
    }
  }

  useEffect(() => {
    if (levelKey === "choice" && current && !deck.finished) {
      const wrong = shuffle(STATES.filter((s) => s.id !== current.id)).slice(0, 3);
      setChoiceOptions(shuffle([current, ...wrong]));
      setPickedChoice(null);
    }
    if ((levelKey === "map" || levelKey === "blank") && !deck.finished) {
      setTyped("");
      setTimeout(() => inputRef.current?.focus(), 50);
    }
    setFlipped(false);
    setFeedback(null);
    setAnswered(false);
  }, [deck.pos, levelKey, deck.finished]);

  function stampState(id) {
    setStamped((prev) => new Set(prev).add(id));
    setStampBurst(true);
    setTimeout(() => setStampBurst(false), 500);
  }

  function advanceDeck(correct) {
    if (answered) return;
    setAnswered(true);
    if (correct) stampState(current.id);
    setTimeout(() => {
      setDeck((d) => {
        const nextPos = d.pos + 1;
        const nextCorrect = d.correct + (correct ? 1 : 0);
        const nextTotal = d.total + 1;
        if (nextPos >= d.order.length) {
          return { ...d, pos: nextPos, correct: nextCorrect, total: nextTotal, finished: true };
        }
        return { ...d, pos: nextPos, correct: nextCorrect, total: nextTotal };
      });
    }, correct ? 350 : 550);
  }

  function finishLevel(passed) {
    if (passed) {
      setCompleted((prev) => new Set(prev).add(levelIdx));
      setUnlockedUpTo((u) => Math.max(u, Math.min(levelIdx + 1, LEVELS.length - 1)));
    }
  }

  function goToLevel(i) {
    if (i > unlockedUpTo) return;
    setLevelIdx(i);
  }
  function retryLevel() {
    setDeck(makeDeck());
  }
  function nextLevel() {
    setLevelIdx((i) => Math.min(i + 1, LEVELS.length - 1));
  }

  function handleChoice(opt) {
    if (pickedChoice) return;
    setPickedChoice(opt.id);
    const correct = opt.id === current.id;
    setFeedback(correct ? "right" : "wrong");
    advanceDeck(correct);
  }
  function handleTypeSubmit(e) {
    e.preventDefault();
    if (feedback) return;
    const correct = normalize(typed) === normalize(current.capital);
    setFeedback(correct ? "right" : "wrong");
    advanceDeck(correct);
  }
  function handleFlashKnow(knewIt) {
    if (answered) return;
    setFlipped(true);
    setTimeout(() => advanceDeck(knewIt), 400);
  }

  function selectState(id) {
    if (match.matchedIds.has(id)) return;
    setMatch((m) => ({ ...m, selectedState: id }));
  }
  function selectCapital(id) {
    if (match.matchedIds.has(id)) return;
    setMatch((m) => {
      if (m.selectedState == null) return { ...m, selectedCapital: id };
      const correct = m.selectedState === id;
      if (correct) {
        stampState(id);
        const wasWrongBefore = m.wrongPairs.has(id);
        const matchedIds = new Set(m.matchedIds).add(id);
        const batchDone = matchedIds.size === m.batches[m.batchIndex].length;
        if (batchDone) {
          const nextIndex = m.batchIndex + 1;
          if (nextIndex >= m.batches.length) {
            return {
              ...m, matchedIds, selectedState: null, selectedCapital: null,
              correctFirstTry: m.correctFirstTry + (wasWrongBefore ? 0 : 1),
              finished: true,
            };
          }
          const nb = m.batches[nextIndex];
          return {
            ...m, matchedIds: new Set(), selectedState: null, selectedCapital: null,
            correctFirstTry: m.correctFirstTry + (wasWrongBefore ? 0 : 1),
            batchIndex: nextIndex,
            leftOrder: shuffle(nb.map((s) => s.id)),
            rightOrder: shuffle(nb.map((s) => s.id)),
          };
        }
        return {
          ...m, matchedIds, selectedState: null, selectedCapital: null,
          correctFirstTry: m.correctFirstTry + (wasWrongBefore ? 0 : 1),
        };
      }
      const wrongPairs = new Set(m.wrongPairs).add(m.selectedState).add(id);
      setTimeout(() => setMatch((m2) => ({ ...m2, selectedState: null, selectedCapital: null, flashWrongIds: null })), 500);
      return { ...m, wrongPairs, flashWrongIds: [m.selectedState, id], selectedCapital: id };
    });
  }

  const progressPct = Math.round((stamped.size / 50) * 100);
  const deckPct = deck.total ? Math.round((deck.correct / deck.total) * 100) : 0;
  const currentBatch = levelKey === "matching" ? match.batches[match.batchIndex] : null;

  return (
    <div className="min-h-screen w-full flex items-start justify-center py-8 px-4" style={{ background: COLORS.ink, fontFamily: "'Inter', sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');
        .font-display { font-family: 'Fraunces', serif; }
        .font-mono { font-family: 'IBM Plex Mono', monospace; }
        @keyframes stampDown {
          0% { transform: scale(2.2) rotate(-14deg); opacity: 0; }
          55% { transform: scale(0.92) rotate(-14deg); opacity: 1; }
          75% { transform: scale(1.06) rotate(-14deg); }
          100% { transform: scale(1) rotate(-14deg); opacity: 1; }
        }
        .stamp-anim { animation: stampDown 0.5s ease-out; }
        @keyframes pulseDot {
          0%, 100% { box-shadow: 0 0 0 0 rgba(160,71,45,0.55); }
          50% { box-shadow: 0 0 0 8px rgba(160,71,45,0); }
        }
        .pulse-dot { animation: pulseDot 1.4s ease-in-out infinite; }
        @media (prefers-reduced-motion: reduce) {
          .stamp-anim, .pulse-dot { animation: none !important; }
        }
      `}</style>

      <div className="w-full max-w-2xl">
        <div className="flex items-center justify-between mb-5">
          <div>
            <h1 className="font-display text-3xl" style={{ color: COLORS.paper }}>Field Atlas</h1>
            <p className="font-mono text-xs tracking-wide" style={{ color: COLORS.sage }}>50 STATES &middot; 50 CAPITALS &middot; NO. 1848</p>
          </div>
          <div className="text-right font-mono" style={{ color: COLORS.brass }}>
            <div className="text-2xl leading-none">{stamped.size}/50</div>
            <div className="text-[10px] tracking-widest" style={{ color: COLORS.sage }}>STAMPED</div>
            <button onClick={resetProgress} className="text-[9px] tracking-widest underline mt-1" style={{ color: COLORS.sage, background: "none", border: "none", padding: 0 }}>RESET PROGRESS</button>
          </div>
        </div>

        <div className="rounded-md p-3 mb-5" style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}` }}>
          <div className="flex gap-1">
            {LEVELS.map((lv, i) => {
              const isLocked = i > unlockedUpTo;
              const isDone = completed.has(i);
              const isCurrent = i === levelIdx;
              return (
                <button
                  key={lv.key}
                  onClick={() => goToLevel(i)}
                  disabled={isLocked}
                  className="flex-1 flex flex-col items-center gap-1 py-2 rounded font-mono text-[10px] tracking-wide"
                  style={{
                    background: isCurrent ? COLORS.paper : "transparent",
                    color: isLocked ? "#4A5A4D" : isCurrent ? COLORS.ink : COLORS.sage,
                    cursor: isLocked ? "not-allowed" : "pointer",
                  }}
                >
                  <span>{isLocked ? "\u{1F512}" : isDone ? "\u2713" : i + 1}</span>
                  <span className="text-center leading-tight">{lv.label.toUpperCase()}</span>
                </button>
              );
            })}
          </div>
        </div>

        <div className="rounded-md p-3 mb-5" style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}` }}>
          <div className="flex items-center justify-between mb-2">
            <span className="font-mono text-[10px] tracking-widest" style={{ color: COLORS.sage }}>PASS THRESHOLD</span>
            <span className="font-mono text-[10px]" style={{ color: COLORS.brass }}>
              Predicts a test score of {(GRADE_OPTIONS.find((g) => g.value === passThreshold) || {}).grade} or better
            </span>
          </div>
          <div className="flex gap-1">
            {GRADE_OPTIONS.map((g) => {
              const isActive = g.value === passThreshold;
              return (
                <button
                  key={g.value}
                  onClick={() => setPassThreshold(g.value)}
                  className="flex-1 flex flex-col items-center py-2 rounded font-mono text-[10px] tracking-wide"
                  style={{ background: isActive ? COLORS.brass : "transparent", color: isActive ? COLORS.ink : COLORS.sage }}
                >
                  <span className="text-sm font-display">{g.grade}</span>
                  <span>{g.pct}%</span>
                </button>
              );
            })}
          </div>
        </div>

        <div className="relative rounded-lg p-8 min-h-[380px] flex flex-col items-center justify-center" style={{ background: COLORS.paper, border: `1px solid ${COLORS.panelBorder}` }}>
          {stampBurst && (
            <div className="stamp-anim absolute top-4 right-4 rounded-full flex items-center justify-center font-display font-bold text-xs px-4 py-4 border-4" style={{ color: COLORS.rust, borderColor: COLORS.rust, transform: "rotate(-14deg)" }}>
              STAMPED
            </div>
          )}

          {levelKey !== "matching" && deck.finished && (
            <LevelSummary
              correct={deck.correct} total={deck.total} pct={deckPct}
              threshold={passThreshold}
              alwaysPass={levelKey === "flash"}
              onRetry={retryLevel}
              onContinue={() => { finishLevel(true); if (levelIdx < LEVELS.length - 1) nextLevel(); }}
              isLast={levelIdx === LEVELS.length - 1}
            />
          )}

          {levelKey === "matching" && match.finished && (
            <LevelSummary
              correct={match.correctFirstTry} total={50} pct={Math.round((match.correctFirstTry / 50) * 100)}
              threshold={passThreshold}
              alwaysPass={false}
              onRetry={() => setMatch(makeMatch())}
              onContinue={() => { finishLevel(true); if (levelIdx < LEVELS.length - 1) nextLevel(); }}
              isLast={levelIdx === LEVELS.length - 1}
            />
          )}

          {levelKey === "flash" && !deck.finished && current && (
            <>
              <p className="font-mono text-xs tracking-widest mb-3" style={{ color: "#8F7A4A" }}>WHAT IS THE CAPITAL OF</p>
              <h2 className="font-display text-4xl text-center mb-2" style={{ color: flipped ? COLORS.rust : COLORS.ink }}>
                {flipped ? current.capital : current.name}
              </h2>
              <p className="font-mono text-[10px] tracking-widest" style={{ color: COLORS.sage }}>{deck.pos + 1} / {deck.order.length}</p>
              {!flipped ? (
                <button onClick={() => setFlipped(true)} className="mt-8 font-mono text-xs tracking-widest px-5 py-2 rounded" style={{ background: COLORS.ink, color: COLORS.paper }}>REVEAL</button>
              ) : (
                <div className="mt-8 flex gap-3">
                  <button disabled={answered} onClick={() => handleFlashKnow(false)} className="font-mono text-xs tracking-widest px-4 py-2 rounded border" style={{ borderColor: COLORS.rust, color: COLORS.rust, opacity: answered ? 0.5 : 1 }}>DIDN'T KNOW</button>
                  <button disabled={answered} onClick={() => handleFlashKnow(true)} className="font-mono text-xs tracking-widest px-4 py-2 rounded" style={{ background: COLORS.pine, color: COLORS.paper, opacity: answered ? 0.5 : 1 }}>KNEW IT</button>
                </div>
              )}
            </>
          )}

          {levelKey === "choice" && !deck.finished && current && (
            <>
              <p className="font-mono text-xs tracking-widest mb-3" style={{ color: "#8F7A4A" }}>CAPITAL OF</p>
              <h2 className="font-display text-4xl text-center mb-1" style={{ color: COLORS.ink }}>{current.name}</h2>
              <p className="font-mono text-[10px] tracking-widest mb-5" style={{ color: COLORS.sage }}>{deck.pos + 1} / {deck.order.length}</p>
              <div className="grid grid-cols-1 gap-2 w-full">
                {choiceOptions.map((opt) => {
                  const isPicked = pickedChoice === opt.id;
                  const isCorrect = opt.id === current.id;
                  let bg = COLORS.paperAlt, txt = COLORS.ink;
                  if (pickedChoice) {
                    if (isCorrect) { bg = COLORS.pine; txt = COLORS.paper; }
                    else if (isPicked) { bg = COLORS.rust; txt = COLORS.paper; }
                  }
                  return (
                    <button key={opt.id} disabled={!!pickedChoice} onClick={() => handleChoice(opt)} className="font-mono text-sm py-3 rounded text-left px-4" style={{ background: bg, color: txt }}>
                      {opt.capital}
                    </button>
                  );
                })}
              </div>
            </>
          )}

          {levelKey === "matching" && !match.finished && currentBatch && (
            <>
              <p className="font-mono text-xs tracking-widest mb-1" style={{ color: "#8F7A4A" }}>MATCH EACH STATE TO ITS CAPITAL</p>
              <p className="font-mono text-[10px] tracking-widest mb-4" style={{ color: COLORS.sage }}>SET {match.batchIndex + 1} / {match.batches.length}</p>
              <div className="grid grid-cols-2 gap-6 w-full">
                <div className="flex flex-col gap-2">
                  {match.leftOrder.map((id) => {
                    const s = STATES[id];
                    const isMatched = match.matchedIds.has(id);
                    const isSelected = match.selectedState === id;
                    const isWrongFlash = match.flashWrongIds && match.flashWrongIds[0] === id;
                    let bg = COLORS.paperAlt;
                    if (isMatched) bg = "transparent";
                    else if (isWrongFlash) bg = COLORS.rust;
                    else if (isSelected) bg = COLORS.brass;
                    return (
                      <button key={id} disabled={isMatched} onClick={() => selectState(id)} className="font-mono text-xs py-2 px-3 rounded text-left" style={{ background: bg, color: isMatched ? "#c9baa0" : isWrongFlash || isSelected ? COLORS.paper : COLORS.ink, opacity: isMatched ? 0.35 : 1 }}>
                        {s.name}
                      </button>
                    );
                  })}
                </div>
                <div className="flex flex-col gap-2">
                  {match.rightOrder.map((id) => {
                    const s = STATES[id];
                    const isMatched = match.matchedIds.has(id);
                    const isSelected = match.selectedCapital === id;
                    const isWrongFlash = match.flashWrongIds && match.flashWrongIds[1] === id;
                    let bg = COLORS.paperAlt;
                    if (isMatched) bg = "transparent";
                    else if (isWrongFlash) bg = COLORS.rust;
                    else if (isSelected) bg = COLORS.brass;
                    return (
                      <button key={id} disabled={isMatched} onClick={() => selectCapital(id)} className="font-mono text-xs py-2 px-3 rounded text-left" style={{ background: bg, color: isMatched ? "#c9baa0" : isWrongFlash || isSelected ? COLORS.paper : COLORS.ink, opacity: isMatched ? 0.35 : 1 }}>
                        {s.capital}
                      </button>
                    );
                  })}
                </div>
              </div>
            </>
          )}

          {levelKey === "map" && !deck.finished && current && (
            <>
              <p className="font-mono text-xs tracking-widest mb-1" style={{ color: "#8F7A4A" }}>LOCATE &amp; TYPE THE CAPITAL OF</p>
              <h2 className="font-display text-3xl text-center mb-3" style={{ color: COLORS.ink }}>{current.name}</h2>
              <div className="relative w-full rounded mb-4" style={{ aspectRatio: "16/9", background: "#E2D6BC", border: "1px solid #c9baa0" }}>
                <div className="absolute font-mono text-[9px] tracking-widest" style={{ top: 6, left: 8, color: "#8F7A4A" }}>UNITED STATES &middot; SCHEMATIC, NOT TO SCALE</div>
                <div className="absolute" style={{ top: "78%", left: 0, right: 0, borderTop: "1px dashed #c9baa0" }} />
                <div className="absolute font-mono text-[8px]" style={{ top: "80%", left: "2%", color: "#8F7A4A" }}>AK / HI INSET</div>
                {STATES.map((s) => {
                  const pos = POS[s.id];
                  const isTarget = s.id === current.id;
                  return (
                    <div
                      key={s.id}
                      title={isTarget ? "?" : s.name}
                      className={isTarget ? "pulse-dot" : ""}
                      style={{
                        position: "absolute", left: `${pos[0]}%`, top: `${pos[1]}%`,
                        width: isTarget ? 12 : 5, height: isTarget ? 12 : 5,
                        borderRadius: 999, transform: "translate(-50%,-50%)",
                        background: isTarget ? COLORS.rust : "#a8967a",
                        border: isTarget ? "2px solid #fff" : "none",
                      }}
                    />
                  );
                })}
              </div>
              <form onSubmit={handleTypeSubmit} className="w-full flex flex-col items-center gap-3">
                <input ref={inputRef} value={typed} onChange={(e) => setTyped(e.target.value)} disabled={!!feedback} placeholder="Type the capital..." className="w-full font-mono text-sm px-4 py-3 rounded outline-none" style={{ background: "#fff", border: `2px solid ${feedback === "right" ? COLORS.pine : feedback === "wrong" ? COLORS.rust : "#c9baa0"}`, color: COLORS.ink }} />
                {feedback === "wrong" && <p className="font-mono text-xs" style={{ color: COLORS.rust }}>Correct answer: {current.capital}</p>}
                {!feedback && <button type="submit" className="font-mono text-xs tracking-widest px-5 py-2 rounded" style={{ background: COLORS.ink, color: COLORS.paper }}>SUBMIT</button>}
              </form>
            </>
          )}

          {levelKey === "blank" && !deck.finished && current && (
            <>
              <p className="font-mono text-xs tracking-widest mb-3" style={{ color: "#8F7A4A" }}>CAPITAL OF</p>
              <h2 className="font-display text-4xl text-center mb-1" style={{ color: COLORS.ink }}>{current.name}</h2>
              <p className="font-mono text-[10px] tracking-widest mb-5" style={{ color: COLORS.sage }}>{deck.pos + 1} / {deck.order.length}</p>
              <form onSubmit={handleTypeSubmit} className="w-full flex flex-col items-center gap-3">
                <input ref={inputRef} value={typed} onChange={(e) => setTyped(e.target.value)} disabled={!!feedback} placeholder="Type the capital..." className="w-full font-mono text-sm px-4 py-3 rounded outline-none" style={{ background: "#fff", border: `2px solid ${feedback === "right" ? COLORS.pine : feedback === "wrong" ? COLORS.rust : "#c9baa0"}`, color: COLORS.ink }} />
                {feedback === "wrong" && <p className="font-mono text-xs" style={{ color: COLORS.rust }}>Correct answer: {current.capital}</p>}
                {!feedback && <button type="submit" className="font-mono text-xs tracking-widest px-5 py-2 rounded" style={{ background: COLORS.ink, color: COLORS.paper }}>SUBMIT</button>}
              </form>
            </>
          )}
        </div>

        <div className="rounded-md p-3 mt-5" style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}` }}>
          <div className="flex items-center justify-between mb-2">
            <span className="font-mono text-[10px] tracking-widest" style={{ color: COLORS.sage }}>TERRITORY STAMPED</span>
            <span className="font-mono text-[10px]" style={{ color: COLORS.brass }}>{progressPct}%</span>
          </div>
          <div className="grid grid-cols-10 gap-1">
            {STATES.map((s) => (
              <div key={s.id} title={s.name} className="h-3 rounded-sm" style={{ background: stamped.has(s.id) ? COLORS.rust : COLORS.panelBorder, opacity: stamped.has(s.id) ? 1 : 0.6 }} />
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function LevelSummary({ correct, total, pct, threshold, alwaysPass, onRetry, onContinue, isLast }) {
  const thresholdPct = Math.round(threshold * 100);
  const thresholdGrade = (GRADE_OPTIONS.find((g) => g.value === threshold) || {}).grade;
  const passed = alwaysPass || pct >= thresholdPct;
  return (
    <div className="flex flex-col items-center text-center">
      <p className="font-mono text-xs tracking-widest mb-2" style={{ color: "#8F7A4A" }}>LEVEL COMPLETE</p>
      <h2 className="font-display text-5xl mb-2" style={{ color: passed ? COLORS.pine : COLORS.rust }}>{pct}%</h2>
      <p className="font-mono text-xs mb-6" style={{ color: COLORS.ink }}>{correct} of {total} correct</p>
      {passed ? (
        <button onClick={onContinue} className="font-mono text-xs tracking-widest px-5 py-3 rounded" style={{ background: COLORS.pine, color: COLORS.paper }}>
          {isLast ? "FINISH" : "CONTINUE \u2192"}
        </button>
      ) : (
        <div className="flex flex-col items-center gap-3">
          <p className="font-mono text-xs" style={{ color: COLORS.rust }}>
            Need {thresholdPct}%{thresholdGrade ? ` (${thresholdGrade})` : ""} to advance
          </p>
          <button onClick={onRetry} className="font-mono text-xs tracking-widest px-5 py-3 rounded" style={{ background: COLORS.rust, color: COLORS.paper }}>RETRY LEVEL</button>
        </div>
      )}
    </div>
  );
}


ReactDOM.render(React.createElement(App), document.getElementById("root"));

</script>
</body>
</html>
